name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run tests with JaCoCo
        run: >-
          ./gradlew --no-daemon clean test
          :util:jacocoTestReport
          :resolver:jacocoTestReport
          :datatype:jacocoTestReport
          :regex-gen:jacocoTestReport
          :regex:jacocoTestReport
          :xsd-datatype:jacocoTestReport

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: >-
            util/build/reports/jacoco/test/jacocoTestReport.xml,resolver/build/reports/jacoco/test/jacocoTestReport.xml,datatype/build/reports/jacoco/test/jacocoTestReport.xml,regex-gen/build/reports/jacoco/test/jacocoTestReport.xml,regex/build/reports/jacoco/test/jacocoTestReport.xml,xsd-datatype/build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            util/build/reports/jacoco
            resolver/build/reports/jacoco
            datatype/build/reports/jacoco
            regex-gen/build/reports/jacoco
            regex/build/reports/jacoco
            xsd-datatype/build/reports/jacoco

